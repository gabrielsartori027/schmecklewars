# Calls the ingest endpoint on a schedule.
# Vercel's Hobby plan caps its own cron at once per day, so the cadence lives here instead.
# GitHub's scheduler is best-effort: runs are often late under load, so treat */10 as
# "about every 10-20 minutes", not a guarantee.
name: ingest

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Never let a slow run overlap the next tick; the endpoint also holds its own 55 s lock.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/cron/ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository's Actions secrets."
            exit 1
          fi
          code=$(curl -sS -m 90 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://aidgoesout.com/api/cron/ingest)
          echo "HTTP $code"
          cat body.json; echo
          # 200 is a real run; the body says whether anything was appended or skipped.
          [ "$code" = "200" ]

